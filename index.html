<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="keys">
      <div data-key="65" class="key">
        <kbd>A</kbd>
        <span class="sound">clap</span>
      </div>
      <div data-key="83" class="key">
        <kbd>S</kbd>
        <span class="sound">hihat</span>
      </div>
      <div data-key="68" class="key">
        <kbd>D</kbd>
        <span class="sound">kick</span>
      </div>
      <div data-key="70" class="key">
        <kbd>F</kbd>
        <span class="sound">openhat</span>
      </div>
      <div data-key="71" class="key">
        <kbd>G</kbd>
        <span class="sound">boom</span>
      </div>
      <div data-key="72" class="key">
        <kbd>H</kbd>
        <span class="sound">ride</span>
      </div>
      <div data-key="74" class="key">
        <kbd>J</kbd>
        <span class="sound">snare</span>
      </div>
      <div data-key="75" class="key">
        <kbd>K</kbd>
        <span class="sound">tom</span>
      </div>
      <div data-key="76" class="key">
        <kbd>L</kbd>
        <span class="sound">tink</span>
      </div>
      <div data-key="186" class="key">
        <kbd>;</kbd>
        <span class="sound">cine</span>
      </div>

      <div data-key="stop" class="key">
        <kbd>Stop</kbd>
        <span
          style="font-family: Arial, Helvetica, sans-serif; font-size: 40px"
          class="sound"
          >Stop</span
        >
      </div>
    </div>
    <audio data-key="65" src="assests/65.wav"></audio>
    <audio data-key="83" src="assests/83.wav"></audio>
    <audio data-key="68" src="assests/68.wav"></audio>
    <audio data-key="70" src="assests/70.wav"></audio>
    <audio data-key="71" src="assests/71.wav"></audio>
    <audio data-key="72" src="assests/72.wav"></audio>
    <audio data-key="74" src="assests/74.wav"></audio>
    <audio data-key="75" src="assests/75.wav"></audio>
    <audio data-key="76" src="assests/76.wav"></audio>
    <audio data-key="186" src="assests/186.wav"></audio>

    <script>
      function playsound(e) {
        const keyCode = e.keyCode || this.getAttribute("data-key");
        const audio = document.querySelector(`audio[data-key="${keyCode}"]`);
        const key = document.querySelector(`.key[data-key="${keyCode}"]`);
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch((err) => console.log(err));
        key.classList.add("playing");
      }

      stopButton = document.querySelector('.key[data-key="stop"]');
      stopButton.addEventListener("click", () => {
        const audios = document.querySelectorAll("audio");
        audios.forEach((audio) => {
          audio.pause();
          audio.currentTime = 0;
        });
      });

      function removeTransition(e) {
        if (e.propertyName !== "transform") return;
        this.classList.remove("playing");
      }

      const keys = document.querySelectorAll(".key");
      keys.forEach((key) => {
        key.addEventListener("click", playsound);
        key.addEventListener("transitionend", removeTransition);
      });

      window.addEventListener("keydown", playsound);
    </script>
  </body>
</html>
